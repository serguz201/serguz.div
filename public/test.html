<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Sistema de Citas - serguz.dev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .result.loading {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        .timer {
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }
        .detail {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            word-wrap: break-word;
        }
        .meet-link {
            margin-top: 10px;
            padding: 10px;
            background: #4285f4;
            color: white;
            border-radius: 4px;
            text-align: center;
        }
        .meet-link a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test de Agendamiento</h1>
        <p class="subtitle">Prueba el sistema de creación de citas con Google Calendar</p>
        
        <form id="testForm">
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" value="Test Usuario" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="serguz127@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="date">Fecha:</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Hora:</label>
                <select id="time" required>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="12:00">12:00 PM</option>
                    <option value="14:00">02:00 PM</option>
                    <option value="15:00">03:00 PM</option>
                    <option value="16:00">04:00 PM</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="type">Tipo de Consulta:</label>
                <select id="type">
                    <option value="Consultoría Angular">Consultoría Angular</option>
                    <option value="Dashboard Corporativo">Dashboard Corporativo</option>
                    <option value="E-commerce">E-commerce</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">🚀 Crear Cita de Prueba</button>
        </form>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        // Set default date to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('date').value = tomorrow.toISOString().split('T')[0];

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            
            // Prepare data
            const bookingData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                type: document.getElementById('type').value,
                message: 'Esta es una cita de prueba del sistema'
            };
            
            // Show loading
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Creando cita...';
            result.className = 'result loading';
            result.style.display = 'block';
            result.innerHTML = `
                <div>🔄 Enviando solicitud a la API...</div>
                <div class="timer" id="timer">Tiempo: 0.0s</div>
            `;
            
            // Start timer
            const startTime = Date.now();
            const timerInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                const timerEl = document.getElementById('timer');
                if (timerEl) {
                    timerEl.textContent = `Tiempo: ${elapsed}s`;
                }
            }, 100);
            
            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const endTime = Date.now();
                const totalTime = ((endTime - startTime) / 1000).toFixed(2);
                clearInterval(timerInterval);
                
                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <div style="font-size: 24px; margin-bottom: 10px;">✅ ¡Cita creada exitosamente!</div>
                        <div class="timer">⏱️ Tiempo total: ${totalTime} segundos</div>
                        <div class="detail">
                            <strong>📅 Detalles:</strong><br>
                            Nombre: ${bookingData.name}<br>
                            Email: ${bookingData.email}<br>
                            Fecha: ${bookingData.date}<br>
                            Hora: ${bookingData.time}<br>
                            Tipo: ${bookingData.type}<br>
                            Event ID: ${data.eventId || 'N/A'}
                        </div>
                        ${data.meetLink ? `
                            <div class="meet-link">
                                🎥 <a href="${data.meetLink}" target="_blank">Abrir Google Meet</a>
                            </div>
                        ` : ''}
                        <div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.8); border-radius: 4px;">
                            ℹ️ <strong>Verifica:</strong><br>
                            1. Tu Google Calendar<br>
                            2. Tu email (${bookingData.email})<br>
                            3. Ambos deberían tener la cita
                        </div>
                    `;
                    
                    // Reset form
                    setTimeout(() => {
                        submitBtn.disabled = false;
                        submitBtn.textContent = '🚀 Crear Cita de Prueba';
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                clearInterval(timerInterval);
                const endTime = Date.now();
                const totalTime = ((endTime - startTime) / 1000).toFixed(2);
                
                result.className = 'result error';
                result.innerHTML = `
                    <div style="font-size: 24px; margin-bottom: 10px;">❌ Error al crear la cita</div>
                    <div class="timer">⏱️ Tiempo: ${totalTime} segundos</div>
                    <div class="detail">
                        <strong>Error:</strong><br>
                        ${error.message}
                    </div>
                    <div style="margin-top: 15px; font-size: 12px;">
                        💡 Verifica que el servidor esté corriendo en el puerto 3000
                    </div>
                `;
                
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Crear Cita de Prueba';
            }
        });
    </script>
</body>
</html>
